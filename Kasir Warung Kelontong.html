<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Daffa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Halaman Login -->
    <div id="login-page" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">Warung Daffa</h1>
            <input type="text" id="username" placeholder="Username (admin/staff)" class="w-full mb-4 p-2 border rounded">
            <input type="password" id="password" placeholder="Password (admin123/staff123)" class="w-full mb-6 p-2 border rounded">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Masuk</button>
        </div>
    </div>

    <!-- Halaman Utama (Awalnya Disembunyikan) -->
    <div id="main-app" class="hidden">
        <!-- Navbar -->
        <nav class="bg-blue-600 text-white p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Warung Daffa</h1>
            <div>
                <span id="user-role" class="mr-4 font-semibold uppercase"></span>
                <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">Keluar</button>
            </div>
        </nav>

        <!-- Menu Tab -->
        <div class="flex overflow-x-auto bg-white shadow mb-4" id="menu-tabs">
            <button onclick="showTab('kasir')" class="flex-1 py-3 font-semibold border-b-4 border-blue-600 focus:outline-none">Kasir</button>
            <button onclick="showTab('stok')" class="flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 admin-only">Stok Barang</button>
            <button onclick="showTab('kasbon')" class="flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 admin-only">Kasbon</button>
            <button onclick="showTab('laporan')" class="flex-1 py-3 font-semibold text-gray-500 hover:text-blue-600 admin-only">Laporan</button>
        </div>

        <!-- Konten Area -->
        <div class="container mx-auto p-4">
            
            <!-- Tab Kasir -->
            <div id="tab-kasir" class="tab-content">
                <h2 class="text-xl font-bold mb-4">Mesin Kasir</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded shadow h-96 overflow-y-auto" id="product-list-kasir">
                        <!-- Daftar produk muncul di sini -->
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="font-bold border-b pb-2 mb-2">Nota Belanja</h3>
                        <ul id="cart-list" class="mb-4 min-h-[150px]"></ul>
                        <div class="font-bold text-xl mb-4 text-right">Total: Rp <span id="total-price">0</span></div>
                        <input type="number" id="uang-bayar" placeholder="Uang Tunai" class="w-full p-2 border rounded mb-2">
                        <button onclick="bayar()" class="w-full bg-green-500 text-white p-3 rounded font-bold">BAYAR</button>
                    </div>
                </div>
            </div>

            <!-- Tab Stok -->
            <div id="tab-stok" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4">Manajemen Stok</h2>
                <div class="bg-white p-4 rounded shadow mb-4 flex gap-2">
                    <input type="text" id="nama-barang" placeholder="Nama Barang" class="border p-2 rounded flex-1">
                    <input type="number" id="harga-barang" placeholder="Harga" class="border p-2 rounded w-32">
                    <input type="number" id="stok-barang" placeholder="Stok" class="border p-2 rounded w-24">
                    <button onclick="tambahBarang()" class="bg-blue-600 text-white px-4 rounded">Tambah</button>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <ul id="stok-list" class="divide-y"></ul>
                </div>
            </div>

            <!-- Tab Kasbon (Bisa Dicicil) -->
            <div id="tab-kasbon" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4">Buku Kasbon</h2>
                <div class="bg-white p-4 rounded shadow mb-4 flex gap-2">
                    <input type="text" id="nama-ngutang" placeholder="Nama Pelanggan" class="border p-2 rounded flex-1">
                    <input type="number" id="jumlah-ngutang" placeholder="Jumlah Utang (Rp)" class="border p-2 rounded flex-1">
                    <button onclick="tambahKasbon()" class="bg-red-500 text-white px-4 rounded">Catat Utang</button>
                </div>
                <div class="bg-white p-4 rounded shadow">
                    <ul id="kasbon-list" class="divide-y"></ul>
                </div>
            </div>

            <!-- Tab Laporan -->
            <div id="tab-laporan" class="tab-content hidden">
                <h2 class="text-xl font-bold mb-4">Laporan Penjualan</h2>
                <div class="bg-white p-4 rounded shadow">
                    <p class="text-gray-600 mb-4">Riwayat transaksi tersimpan otomatis di sistem.</p>
                    <ul id="laporan-list" class="divide-y"></ul>
                </div>
            </div>

        </div>
    </div>

    <!-- Hubungkan ke file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
